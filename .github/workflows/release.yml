name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create on main, e.g. v0.1.0-beta.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Check manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual releases must be started from main."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::The tag $TAG already exists."
            exit 1
          fi

      - name: Derive version from tag
        id: version
        run: scripts/release-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          APKMANAGER_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          APKMANAGER_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          APKMANAGER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          APKMANAGER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >
          ./gradlew assembleRelease
          -Papkmanager.versionName="$VERSION_NAME"
          -Papkmanager.versionCode="$VERSION_CODE"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Prepare release files
        id: files
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk="APK-Manager-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

          build_tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          apksigner="$ANDROID_HOME/build-tools/$build_tools/apksigner"
          "$apksigner" verify "$apk"
          certificate=$("$apksigner" verify --print-certs "$apk" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')

          {
            echo "## Verify the download"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| APK SHA-256 | \`$(cut -d' ' -f1 "$apk.sha256")\` |"
            echo "| Signing certificate SHA-256 | \`$certificate\` |"
            echo
          } > release-notes.md
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.files.outputs.apk }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--title "APK Manager $VERSION_NAME" --notes-file release-notes.md --generate-notes)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Creates the tag on the commit that was built.
            args+=(--target "$GITHUB_SHA")
          else
            args+=(--verify-tag)
          fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "$APK" "$APK.sha256" "${args[@]}"
