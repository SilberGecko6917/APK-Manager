name: Feature request
description: Suggest an idea or improvement for APK Manager
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem would this feature solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links or anything else that helps.
    validations:
      required: false

  - type: checkboxes
    id: search
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
