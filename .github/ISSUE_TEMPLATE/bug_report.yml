name: Bug report
description: Report a reproducible problem with APK Manager
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.
        For security vulnerabilities, do not open an issue. Use the "Security" tab and "Report a vulnerability" instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably reproduce the problem.
      placeholder: |
        1. Open APK Manager
        2. Tap ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the app's settings or About screen.
      placeholder: "e.g. 1.2.3"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "e.g. Android 15"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: "e.g. Pixel 8"
    validations:
      required: false

  - type: dropdown
    id: installer
    attributes:
      label: Installer backend
      options:
        - Default (system installer)
        - Shizuku
        - Root
        - Unknown
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: Tracked repository / source
      description: The GitHub repository (owner/name) involved, if relevant. Do not include private details you do not want public.
      placeholder: "e.g. owner/repo"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logcat output or error messages. Remove any tokens or personal data before pasting.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: search
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
