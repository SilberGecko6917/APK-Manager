version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # Kotlin, the Compose compiler plugin and KSP must be updated together.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      android-gradle-plugin:
        patterns:
          - "com.android.*"
      androidx:
        patterns:
          - "androidx.*"
      hilt:
        patterns:
          - "com.google.dagger*"
      code-quality:
        patterns:
          - "com.diffplug.spotless*"
          - "com.pinterest.ktlint*"
          - "io.gitlab.arturbosch.detekt*"
          - "io.nlopez.compose.rules*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
