version: 2

# Maven Central rate-limits shared CI IP ranges (HTTP 429), so Dependabot resolves
# Maven Central artifacts through Google's official mirror instead.
registries:
  maven-central-mirror:
    type: maven-repository
    url: https://maven-central.storage-download.googleapis.com/maven2/
    replaces-base: true
  google:
    type: maven-repository
    url: https://dl.google.com/dl/android/maven2/

updates:
  - package-ecosystem: gradle
    directory: /
    registries:
      - maven-central-mirror
      - google
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # Kotlin, the Compose compiler plugin and KSP must be updated together.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      android-gradle-plugin:
        patterns:
          - "com.android.*"
      androidx:
        patterns:
          - "androidx.*"
      hilt:
        patterns:
          - "com.google.dagger*"
      code-quality:
        patterns:
          - "com.diffplug.spotless*"
          - "com.pinterest.ktlint*"
          - "io.gitlab.arturbosch.detekt*"
          - "io.nlopez.compose.rules*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
