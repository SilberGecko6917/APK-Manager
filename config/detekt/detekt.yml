# Detekt configuration. Builds upon the default configuration (`buildUponDefaultConfig = true`),
# so only deviations from the defaults are listed here.

config:
  validation: true
  # Rule options of the Compose rule set are not part of its default config, so detekt cannot validate them.
  excludes: "Compose>.*"

naming:
  # ktlint's filename rule already covers this; Compose files are named after their main composable.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    # Composable functions use PascalCase.
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][A-Za-z0-9_]*"

complexity:
  LongParameterList:
    # Composables commonly take many parameters (state, callbacks, modifier).
    ignoreAnnotated:
      - Composable
  TooManyFunctions:
    # Implementations of an interface should not be penalized for its size.
    ignoreOverridden: true
    ignoreAnnotatedFunctions:
      - Preview

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated:
      - Composable
      - Preview
  UnusedPrivateMember:
    ignoreAnnotated:
      - Preview
  ForbiddenComment:
    active: false

# Compose rules (io.nlopez.compose.rules:detekt)
Compose:
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals:
      - LocalSectionItemShapes
  ModifierMissing:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MutableParams:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
